version: '3.8'

services:
  backend:
    build: ./backend
    container_name: quant-backend
    ports:
      - "8080:8080"
    environment:
      - ALLOWED_ORIGINS=*
    restart: always

  frontend:
    build: ./frontend
    container_name: quant-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always
